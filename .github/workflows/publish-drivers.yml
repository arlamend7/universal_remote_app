name: Publish Universal Remote drivers

on:
  pull_request:
    paths:
      - 'drivers/**'
      - 'packages/remote_driver_*/**'
      - '.github/workflows/publish-drivers.yml'
  push:
    branches: ['feature/dynamic-driver-runtime']
    paths:
      - 'drivers/**'
      - 'packages/remote_driver_*/**'
      - '.github/workflows/publish-drivers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install verified Flutter SDK
        run: |
          git clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - name: Validate every integration against the runtime and schemas
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s drivers/tests
