name: Validate Universal Remote
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  android-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the verified Flutter and bundled Dart SDKs
        run: |
          git clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --version
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed packages apps/universal_remote_app/lib apps/universal_remote_app/test test tool
      - run: dart run tool/check_structure.dart
      - run: dart analyze
      - run: dart run tool/audit_dependencies.dart
      - run: dart test test packages/remote_core/test packages/remote_network/test packages/remote_driver_runtime/test packages/remote_driver_manager/test packages/remote_lg_webos/test packages/remote_android_tv/test packages/remote_roku/test packages/remote_samsung_tizen/test
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s drivers/tests
      - run: flutter test --no-pub
        working-directory: apps/universal_remote_app
      - run: flutter build apk --debug --no-pub
        working-directory: apps/universal_remote_app
